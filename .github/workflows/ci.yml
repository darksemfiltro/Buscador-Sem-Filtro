name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check
        run: npm run check
